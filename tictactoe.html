<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Tic Tac Toe</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkBg: '#0f172a',
                        cardBg: 'rgba(30, 41, 59, 0.7)',
                        neonX: '#38bdf8',
                        neonO: '#f43f5e',
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Canvas Confetti CDN -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: radial-gradient(circle at top center, #1e293b, #0f172a);
            min-height: 100vh;
        }
        .glass-panel {
            background: rgba(30, 41, 59, 0.65);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .cell-hover:hover {
            background: rgba(56, 189, 248, 0.1);
            border-color: rgba(56, 189, 248, 0.3);
        }
        @keyframes pulse-glow {
            0%, 100% { transform: scale(1); filter: drop-shadow(0 0 15px rgba(56, 189, 248, 0.6)); }
            50% { transform: scale(1.03); filter: drop-shadow(0 0 25px rgba(56, 189, 248, 0.9)); }
        }
        .animate-glow {
            animation: pulse-glow 2s infinite ease-in-out;
        }
    </style>
</head>
<body class="text-slate-100 flex flex-col items-center justify-between min-h-screen p-4 md:p-6">

    <header class="w-full max-w-md text-center pt-4">
        <h1 class="text-3xl md:text-4xl font-extrabold tracking-wider bg-gradient-to-r from-sky-400 via-indigo-300 to-rose-400 bg-clip-text text-transparent">
            TIC TAC TOE
        </h1>
        <p class="text-slate-400 text-sm mt-1">Sleek. Modern. Unbeatable.</p>
    </header>

    <main class="w-full max-w-md my-auto flex flex-col items-center space-y-6">
        
        <!-- Game Mode Selection & Difficulty -->
        <div class="glass-panel w-full p-4 rounded-2xl shadow-xl flex flex-col space-y-3">
            <div class="flex justify-between items-center bg-slate-900/60 p-1.5 rounded-xl border border-slate-700/50">
                <button id="modePvP" onclick="setGameMode('pvp')" class="flex-1 py-2 text-xs md:text-sm font-semibold rounded-lg transition-all duration-300 bg-sky-500 text-white shadow-md">
                    <i class="fa-solid fa-user-group mr-1.5"></i> 2 Players
                </button>
                <button id="modeAI" onclick="setGameMode('ai')" class="flex-1 py-2 text-xs md:text-sm font-semibold rounded-lg transition-all duration-300 text-slate-400 hover:text-white">
                    <i class="fa-solid fa-robot mr-1.5"></i> vs AI
                </button>
            </div>

            <!-- AI Difficulty selector (hidden by default) -->
            <div id="aiDifficultyContainer" class="hidden flex items-center justify-between px-1 text-xs text-slate-400">
                <span>AI Difficulty:</span>
                <div class="space-x-1">
                    <button onclick="setDifficulty('easy')" id="diffEasy" class="px-2.5 py-1 rounded-md bg-slate-800 text-slate-300 hover:bg-slate-700 transition">Easy</button>
                    <button onclick="setDifficulty('hard')" id="diffHard" class="px-2.5 py-1 rounded-md bg-sky-600 text-white shadow transition font-medium">Unbeatable</button>
                </div>
            </div>
        </div>

        <div class="grid grid-cols-3 gap-3 w-full">
            <div class="glass-panel p-3 rounded-xl text-center border-b-4 border-sky-400">
                <div class="text-xs text-slate-400 font-medium">PLAYER X</div>
                <div id="scoreX" class="text-xl font-bold text-sky-400 mt-0.5">0</div>
            </div>
            <div class="glass-panel p-3 rounded-xl text-center border-b-4 border-slate-500">
                <div class="text-xs text-slate-400 font-medium">TIES</div>
                <div id="scoreTies" class="text-xl font-bold text-slate-300 mt-0.5">0</div>
            </div>
            <div class="glass-panel p-3 rounded-xl text-center border-b-4 border-rose-500">
                <div id="labelO" class="text-xs text-slate-400 font-medium">PLAYER O</div>
                <div id="scoreO" class="text-xl font-bold text-rose-500 mt-0.5">0</div>
            </div>
        </div>

        <!-- Turn / Status Indicator -->
        <div id="statusBanner" class="glass-panel px-6 py-2.5 rounded-full text-sm font-semibold tracking-wide text-slate-200 border border-slate-700/50 flex items-center space-x-2">
            <span class="w-2.5 h-2.5 rounded-full bg-sky-400 animate-pulse"></span>
            <span id="statusText">Player X's Turn</span>
        </div>

        <div class="glass-panel p-4 rounded-3xl shadow-2xl w-full aspect-square max-w-[360px] grid grid-cols-3 gap-3.5 border border-slate-700/60 relative">
            <!-- Cell 0 -->
            <button onclick="makeMove(0)" class="cell bg-slate-900/50 border border-slate-700/40 rounded-2xl flex items-center justify-center text-5xl md:text-6xl font-extrabold transition-all duration-200 cell-hover shadow-inner focus:outline-none" data-index="0"></button>
            <!-- Cell 1 -->
            <button onclick="makeMove(1)" class="cell bg-slate-900/50 border border-slate-700/40 rounded-2xl flex items-center justify-center text-5xl md:text-6xl font-extrabold transition-all duration-200 cell-hover shadow-inner focus:outline-none" data-index="1"></button>
            <!-- Cell 2 -->
            <button onclick="makeMove(2)" class="cell bg-slate-900/50 border border-slate-700/40 rounded-2xl flex items-center justify-center text-5xl md:text-6xl font-extrabold transition-all duration-200 cell-hover shadow-inner focus:outline-none" data-index="2"></button>
            <!-- Cell 3 -->
            <button onclick="makeMove(3)" class="cell bg-slate-900/50 border border-slate-700/40 rounded-2xl flex items-center justify-center text-5xl md:text-6xl font-extrabold transition-all duration-200 cell-hover shadow-inner focus:outline-none" data-index="3"></button>
            <!-- Cell 4 -->
            <button onclick="makeMove(4)" class="cell bg-slate-900/50 border border-slate-700/40 rounded-2xl flex items-center justify-center text-5xl md:text-6xl font-extrabold transition-all duration-200 cell-hover shadow-inner focus:outline-none" data-index="4"></button>
            <!-- Cell 5 -->
            <button onclick="makeMove(5)" class="cell bg-slate-900/50 border border-slate-700/40 rounded-2xl flex items-center justify-center text-5xl md:text-6xl font-extrabold transition-all duration-200 cell-hover shadow-inner focus:outline-none" data-index="5"></button>
            <!-- Cell 6 -->
            <button onclick="makeMove(6)" class="cell bg-slate-900/50 border border-slate-700/40 rounded-2xl flex items-center justify-center text-5xl md:text-6xl font-extrabold transition-all duration-200 cell-hover shadow-inner focus:outline-none" data-index="6"></button>
            <!-- Cell 7 -->
            <button onclick="makeMove(7)" class="cell bg-slate-900/50 border border-slate-700/40 rounded-2xl flex items-center justify-center text-5xl md:text-6xl font-extrabold transition-all duration-200 cell-hover shadow-inner focus:outline-none" data-index="7"></button>
            <!-- Cell 8 -->
            <button onclick="makeMove(8)" class="cell bg-slate-900/50 border border-slate-700/40 rounded-2xl flex items-center justify-center text-5xl md:text-6xl font-extrabold transition-all duration-200 cell-hover shadow-inner focus:outline-none" data-index="8"></button>
        </div>

        <div class="flex space-x-3 w-full">
            <button onclick="resetBoard()" class="flex-1 py-3 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-xl font-semibold text-sm transition shadow-lg border border-slate-700 flex items-center justify-center space-x-2">
                <i class="fa-solid fa-rotate-right"></i>
                <span>New Round</span>
            </button>
            <button onclick="resetScores()" class="px-4 py-3 bg-rose-950/40 hover:bg-rose-900/50 text-rose-300 rounded-xl font-semibold text-sm transition shadow-lg border border-rose-900/50 flex items-center justify-center" title="Reset Scores">
                <i class="fa-solid fa-trash-can"></i>
            </button>
        </div>

    </main>

    <footer class="text-xs text-slate-500 text-center pb-2">
        Built with Tailwind CSS & JavaScript
    </footer>

    <script>
        // Game State Variables
        let board = ['', '', '', '', '', '', '', '', ''];
        let currentPlayer = 'X'; // 'X' or 'O'
        let isGameActive = true;
        let gameMode = 'pvp'; // 'pvp' or 'ai'
        let aiDifficulty = 'hard'; // 'easy' or 'hard'

        // Scores
        let scores = {
            X: 0,
            O: 0,
            ties: 0
        };

        // Winning Combinations
        const winningConditions = [
            [0, 1, 2], [3, 4, 5], [6, 7, 8], // Rows
            [0, 3, 6], [1, 4, 7], [2, 5, 8], // Columns
            [0, 4, 8], [2, 4, 6]              // Diagonals
        ];

        // DOM Elements
        const statusText = document.getElementById('statusText');
        const scoreXEl = document.getElementById('scoreX');
        const scoreOEl = document.getElementById('scoreO');
        const scoreTiesEl = document.getElementById('scoreTies');
        const labelO = document.getElementById('labelO');
        const cells = document.querySelectorAll('.cell');

        // Mode Switching
        function setGameMode(mode) {
            gameMode = mode;
            const btnPvP = document.getElementById('modePvP');
            const btnAI = document.getElementById('modeAI');
            const aiContainer = document.getElementById('aiDifficultyContainer');

            if (mode === 'pvp') {
                btnPvP.className = "flex-1 py-2 text-xs md:text-sm font-semibold rounded-lg transition-all duration-300 bg-sky-500 text-white shadow-md";
                btnAI.className = "flex-1 py-2 text-xs md:text-sm font-semibold rounded-lg transition-all duration-300 text-slate-400 hover:text-white";
                aiContainer.classList.add('hidden');
                labelO.innerText = 'PLAYER O';
            } else {
                btnAI.className = "flex-1 py-2 text-xs md:text-sm font-semibold rounded-lg transition-all duration-300 bg-rose-600 text-white shadow-md";
                btnPvP.className = "flex-1 py-2 text-xs md:text-sm font-semibold rounded-lg transition-all duration-300 text-slate-400 hover:text-white";
                aiContainer.classList.remove('hidden');
                labelO.innerText = 'AI (O)';
            }
            resetScores();
            resetBoard();
        }

        // Difficulty Switching
        function setDifficulty(diff) {
            aiDifficulty = diff;
            const btnEasy = document.getElementById('diffEasy');
            const btnHard = document.getElementById('diffHard');
            if (diff === 'easy') {
                btnEasy.className = "px-2.5 py-1 rounded-md bg-sky-600 text-white shadow transition font-medium";
                btnHard.className = "px-2.5 py-1 rounded-md bg-slate-800 text-slate-300 hover:bg-slate-700 transition";
            } else {
                btnHard.className = "px-2.5 py-1 rounded-md bg-sky-600 text-white shadow transition font-medium";
                btnEasy.className = "px-2.5 py-1 rounded-md bg-slate-800 text-slate-300 hover:bg-slate-700 transition";
            }
            resetBoard();
        }

        // Handle Player Move
        function makeMove(index) {
            if (board[index] !== '' || !isGameActive) return;

            // If playing vs AI and it's AI's turn, ignore click
            if (gameMode === 'ai' && currentPlayer === 'O') return;

            executeMove(index, currentPlayer);

            if (isGameActive && gameMode === 'ai' && currentPlayer === 'O') {
                // Trigger AI response with slight natural delay
                setTimeout(aiTurn, 400);
            }
        }

        // Execute move on board and UI
        function executeMove(index, player) {
            board[index] = player;
            const cell = cells[index];
            cell.innerText = player;
            
            if (player === 'X') {
                cell.className = "cell bg-slate-900/50 border border-sky-500/30 rounded-2xl flex items-center justify-center text-5xl md:text-6xl font-extrabold text-sky-400 shadow-[0_0_15px_rgba(56,189,248,0.25)]";
            } else {
                cell.className = "cell bg-slate-900/50 border border-rose-500/30 rounded-2xl flex items-center justify-center text-5xl md:text-6xl font-extrabold text-rose-500 shadow-[0_0_15px_rgba(244,63,94,0.25)]";
            }

            checkGameResult();
        }

        // Check for Win or Tie
        function checkGameResult() {
            let roundWon = false;
            let winningCombo = [];

            for (let i = 0; i < winningConditions.length; i++) {
                const [a, b, c] = winningConditions[i];
                if (board[a] && board[a] === board[b] && board[a] === board[c]) {
                    roundWon = true;
                    winningCombo = [a, b, c];
                    break;
                }
            }

            if (roundWon) {
                isGameActive = false;
                scores[currentPlayer]++;
                updateScoresDisplay();
                highlightWinningCells(winningCombo);
                
                const winnerName = (gameMode === 'ai' && currentPlayer === 'O') ? 'AI' : `Player ${currentPlayer}`;
                statusText.innerText = `${winnerName} Wins! 🎉`;
                triggerConfetti();
                return;
            }

            if (!board.includes('')) {
                isGameActive = false;
                scores.ties++;
                updateScoresDisplay();
                statusText.innerText = "It's a Tie! 🤝";
                return;
            }

            // Switch Turn
            currentPlayer = currentPlayer === 'X' ? 'O' : 'X';
            if (gameMode === 'pvp') {
                statusText.innerText = `Player ${currentPlayer}'s Turn`;
            } else {
                statusText.innerText = currentPlayer === 'X' ? "Your Turn (X)" : "AI is thinking...";
            }
        }

        // Highlight Winning Cells
        function highlightWinningCells(combo) {
            combo.forEach(index => {
                cells[index].classList.add('animate-pulse', 'bg-slate-800/80', 'border-amber-400/60');
            });
        }

        // AI Logic
        function aiTurn() {
            if (!isGameActive) return;

            let move;
            if (aiDifficulty === 'easy') {
                move = getRandomMove();
            } else {
                move = getBestMove();
            }

            if (move !== undefined) {
                executeMove(move, 'O');
            }
        }

        // Random Move for Easy AI
        function getRandomMove() {
            const emptyIndices = board.map((val, idx) => val === '' ? idx : null).filter(val => val !== null);
            if (emptyIndices.length === 0) return undefined;
            const randomIndex = Math.floor(Math.random() * emptyIndices.length);
            return emptyIndices[randomIndex];
        }

        // Unbeatable Minimax Algorithm for Hard AI
        function getBestMove() {
            let bestScore = -Infinity;
            let bestMove;
            for (let i = 0; i < 9; i++) {
                if (board[i] === '') {
                    board[i] = 'O';
                    let score = minimax(board, 0, false);
                    board[i] = '';
                    if (score > bestScore) {
                        bestScore = score;
                        bestMove = i;
                    }
                }
            }
            return bestMove;
        }

        function minimax(newBoard, depth, isMaximizing) {
            let result = checkWinnerForMinimax(newBoard);
            if (result !== null) {
                if (result === 'O') return 10 - depth;
                if (result === 'X') return depth - 10;
                if (result === 'tie') return 0;
            }

            if (isMaximizing) {
                let bestScore = -Infinity;
                for (let i = 0; i < 9; i++) {
                    if (newBoard[i] === '') {
                        newBoard[i] = 'O';
                        let score = minimax(newBoard, depth + 1, false);
                        newBoard[i] = '';
                        bestScore = Math.max(score, bestScore);
                    }
                }
                return bestScore;
            } else {
                let bestScore = Infinity;
                for (let i = 0; i < 9; i++) {
                    if (newBoard[i] === '') {
                        newBoard[i] = 'X';
                        let score = minimax(newBoard, depth + 1, true);
                        newBoard[i] = '';
                        bestScore = Math.min(score, bestScore);
                    }
                }
                return bestScore;
            }
        }

        function checkWinnerForMinimax(b) {
            for (let i = 0; i < winningConditions.length; i++) {
                const [x, y, z] = winningConditions[i];
                if (b[x] && b[x] === b[y] && b[x] === b[z]) {
                    return b[x];
                }
            }
            if (!b.includes('')) return 'tie';
            return null;
        }

        // Reset Board for Next Round
        function resetBoard() {
            board = ['', '', '', '', '', '', '', '', ''];
            isGameActive = true;
            currentPlayer = 'X';
            statusText.innerText = (gameMode === 'ai') ? "Your Turn (X)" : "Player X's Turn";

            cells.forEach(cell => {
                cell.innerText = '';
                cell.className = "cell bg-slate-900/50 border border-slate-700/40 rounded-2xl flex items-center justify-center text-5xl md:text-6xl font-extrabold transition-all duration-200 cell-hover shadow-inner focus:outline-none";
            });
        }

        // Reset Scores
        function resetScores() {
            scores = { X: 0, O: 0, ties: 0 };
            updateScoresDisplay();
        }

        function updateScoresDisplay() {
            scoreXEl.innerText = scores.X;
            scoreOEl.innerText = scores.O;
            scoreTiesEl.innerText = scores.ties;
        }

        // Confetti Celebration
        function triggerConfetti() {
            confetti({
                particleCount: 80,
                spread: 70,
                origin: { y: 0.6 }
            });
        }
    </script>
</body>
</html>
